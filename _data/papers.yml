# Papers shown on research.md.
# To add a paper: copy an entry, edit it, and put its thumbnail in images/.
# Fields:
#   title      Use \( ... \) for math, e.g. '\(\mathrm{SL}_3(\mathbb{R})\)'.
#              (Use single quotes when the title contains backslashes.)
#   image      File name inside images/.
#   alt        Short description of the image (for screen readers).
#   coauthors  Optional list of {name, url}.
#   venue      Journal reference or "Preprint (year)."
#   links      List of {label, url}; shown as [label].
#   status     Optional, e.g. "(submitted)".

